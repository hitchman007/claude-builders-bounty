name: Deploy Family Guard Pro Pages
on:
  push:
    branches: ["familyguard-preview"]
    paths:
      - "familyguard/**"
      - ".github/workflows/familyguard-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "familyguard-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Family Guard Pro
        uses: actions/upload-pages-artifact@v3
        with:
          path: familyguard
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
